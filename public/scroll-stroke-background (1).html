<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scroll Stroke Background Demo</title>
<style>
  :root{
    --bg: #00000000;
    --ink: #0000004e;
    --muted: #000000;
    --stroke: #ff0000;
    --stroke-dim: rgba(255, 0, 0, 0);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------------------------------------------------------
     THE BACKGROUND LAYER
     Fixed, full-viewport, sits behind all page content.
     Contains an SVG whose path is "drawn" via stroke-dashoffset
     as the user scrolls from top of document to the footer.
  --------------------------------------------------------- */
  #stroke-bg {
    position: fixed;
    inset: 012;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none; ;
  }

  #stroke-bg svg {
    max-width: 100%;
    height: 100%;
    display:inline-flex;z-index: 1;
    position:left;top: 0;left: 100vh; padding-left: 400px;
  }

  #stroke-path {
    fill: none;
    stroke: var(--stroke);
    stroke-width: 100;stroke-linecap:square;z-index:2;
    stroke-linecap: round;
   
    /* dasharray/offset are set in JS once we know the path length */
  }

  #stroke-path-track {
    fill: none;
    stroke: var(--stroke-faint);
    stroke-width: 1;
    stroke-linecap:square;z-index:0;
  }

  /* ---------------------------------------------------------
     Demo page content — replace with your real site content.
     Just make sure your sections sit above the fixed background
     (any background color on your sections is fine; the stroke
     shows through gaps / transparent areas).
  --------------------------------------------------------- */
  header, main, footer {
    position: relative;
    z-index: 10;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px; color: #000000;
  }

  header {
    padding-top: 18vh; z-index: 10;
    padding-bottom: 12vh;
  }

  header h1 {
    font-size: clamp(2rem, 6vw, 3.4rem);
    line-height: 1.05;
    margin: 0 0 16px;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--muted);
    font-size: 1.1rem;
    max-width: 46ch;
  }

  section {
    padding: 14vh 0;
    border-top: 1px solid rgb(0, 0, 0);
  }

  section h2 {
    font-size: 1.6rem;
    margin-bottom: 12px;
  }

  section p {
    color: var(--muted);
    line-height: 1.7;
    max-width: 60ch;
  }

  footer {
    padding: 10vh 24px 14vh;
    border-top: 1px solid rgb(0, 0, 0);
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

  <!-- BACKGROUND: fixed SVG stroke that draws as you scroll -->
  <div id="stroke-bg">
    <svg id="stroke-svg" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- faint full track, always visible -->
      <path id="stroke-path-track" d="" />
      <!-- bright animated stroke, drawn progressively -->
      <path id="stroke-path" d="" />
    </svg>
  </div>

  <!-- DEMO CONTENT -->
  <header>
    <h1>Your headline goes here</h1>
 

  <main>
    <section>
      <h2>Section one</h2>
     
    </section>
    <section>
      <h2>Section two</h2>
     
    </section>
    <section>
      <h2>Section three</h2>
     
    </section>
  </main>

  <footer id="site-footer">
  
  </footer>

  <script>
  (function () {
    const svg = document.getElementById('stroke-svg');
    const track = document.getElementById('stroke-path-track');
    const path = document.getElementById('stroke-path');
    const footer = document.getElementById('site-footer');

    let pathLength = -230;

    // Build a wandering vertical path spanning from the top of the
    // document to the footer. Uses viewport-width units so it scales
    // nicely; height is set to the full scrollable document height.
    function buildPath() {
      const vw = window.innerWidth;
      const docHeight = footer.offsetTop + footer.offsetHeight; // top -> end of footer
      svg.setAttribute('viewBox', `1 0 ${vw} ${docHeight}`);

      const midX = vw * 0.5;0.25
      const amplitude = Math.min(vw * 0.8, 500); // how far it wanders left/right
      const segments = Math.max(6, Math.round(docHeight / 500)); // one wave roughly every 500px
      const segHeight = docHeight / segments;

      let d = `M ${midX} 0`;
      let prevX = midX;
      for (let i = 1; i <= segments; i++) {
        const y = segHeight * i;
        const dir = i % 2 === 0 ? 1 : -1;
        const targetX = midX + dir * amplitude * (0.5 + Math.random() * 0.5);
        const cy1 = y - segHeight * 0.66;
        const cy2 = y - segHeight * 0.33;
        d += ` C ${prevX} ${cy1}, ${targetX} ${cy2}, ${targetX} ${y}`;
        prevX = targetX;
      }

      track.setAttribute('d', d);
      path.setAttribute('d', d);

      pathLength = path.getTotalLength();
      path.style.strokeDasharray = pathLength;
      path.style.strokeDashoffset = pathLength; // start fully hidden
    }

    // On scroll, reveal the stroke in proportion to how far the user
    // has scrolled from the top of the page to the footer.
    function updateProgress() {
      const scrollTop = window.scrollY;
      const footerEnd = footer.offsetTop + footer.offsetHeight - window.innerHeight;
      const progress = footerEnd > 0 ? Math.min(1, Math.max(0, scrollTop / footerEnd)) : 1;

      path.style.strokeDashoffset = pathLength * (1 - progress);
    }

    let resizeTimer;
    function onResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        buildPath();
        updateProgress();
      }, 150);
    }

    window.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', onResize);
    window.addEventListener('load', () => {
      buildPath();
      updateProgress();
    });

    buildPath();
    updateProgress();
  })();
  </script>

</body>
</html>
